[project]
name = "kaggle-dingdong"
version = "0.1.0"
description = "Kaggle competition notifier via email, Slack, and Discord"
requires-python = ">=3.13"
dependencies = [
    "kaggle",
    "python-dotenv",
]

[project.scripts]
kaggle-dingdong = "kaggle_dingdong.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_dingdong"]

[dependency-groups]
dev = [
    "pytest",
]
